name: industrial_feedback_kit
# description must stay ASCII: pub on Windows decodes `git show` output with the system code page.
description: "Haptic and audio feedback (PASS / FAIL / WARNING) for PDA scanners and factory-floor Flutter apps."
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
