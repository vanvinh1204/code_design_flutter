name: pda_broadcast_kit
# description must stay ASCII: pub on Windows decodes `git show` output with the system code page.
description: "Android plugin that receives PDA scan broadcasts (Zebra DataWedge, iData) over EventChannel, decodes the barcode and optionally controls DataWedge over MethodChannel."
version: 0.2.1
publish_to: "none"

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  plugin:
    platforms:
      android:
        package: com.pda_broadcast_kit
        pluginClass: PdaBroadcastKitPlugin
