name: pda_broadcast_kit
description: Lắng nghe broadcast PDA (Zebra TC21 / iData) qua EventChannel, giải mã barcode, tùy chọn DataWedge MethodChannel. Plugin Android có sẵn Kotlin.
version: 0.2.1
publish_to: "none"

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  plugin:
    platforms:
      android:
        package: com.pda_broadcast_kit
        pluginClass: PdaBroadcastKitPlugin
